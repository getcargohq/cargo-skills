name: skills-lint

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    name: Validate SKILL.md frontmatter, JSON snippets, internal links
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Run skill-bundle linter
        run: node .github/scripts/skills-lint.mjs .

  qa-script-fixtures:
    name: Run QA script fixture suites
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Node >= 22.18: the QA scripts are .ts run via native type-stripping.
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Run every QA script against its fixtures
        run: |
          set -euo pipefail
          shopt -s nullglob
          scripts=(cargo-gtm/scripts/*.ts)
          if [ ${#scripts[@]} -eq 0 ]; then
            echo "no QA scripts found — expected cargo-gtm/scripts/*.ts" >&2
            exit 1
          fi
          for script in "${scripts[@]}"; do
            echo "::group::${script} --fixtures"
            node "$script" --fixtures
            echo "::endgroup::"
          done

      - name: Check llms.txt is in sync with the skill tree
        run: node .github/scripts/generate-llms-txt.ts --check

      - name: Check integration/provider names in descriptions are in sync
        run: node .github/scripts/sync-trigger-slugs.ts --check

  routing-evals:
    name: Route prompts to the right skill
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # The `description` field is the only text an agent sees before deciding
      # whether to load a skill. This is the regression test for it.
      - name: Run routing evals
        run: node .github/scripts/routing-eval.ts
