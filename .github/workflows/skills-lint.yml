name: skills-lint

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    name: Validate SKILL.md frontmatter, JSON snippets, internal links
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20"

      - name: Run skill-bundle linter
        run: node .github/scripts/skills-lint.mjs .

  qa-script-fixtures:
    name: Run QA script fixture suites
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Node >= 22.18: the QA scripts are .ts run via native type-stripping.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"

      - name: Run every QA script against its fixtures
        run: |
          set -euo pipefail
          shopt -s nullglob
          scripts=(cargo-gtm/scripts/*.ts)
          if [ ${#scripts[@]} -eq 0 ]; then
            echo "no QA scripts found — expected cargo-gtm/scripts/*.ts" >&2
            exit 1
          fi
          for script in "${scripts[@]}"; do
            echo "::group::${script} --fixtures"
            node "$script" --fixtures
            echo "::endgroup::"
          done

      - name: Check llms.txt is in sync with the skill tree
        run: node .github/scripts/generate-llms-txt.ts --check

      - name: Check integration/provider names in descriptions are in sync
        run: node .github/scripts/sync-trigger-slugs.ts --check

      # The session hooks write this marker into every Cargo session row, so a
      # regression here corrupts telemetry silently rather than failing loudly.
      - name: Run the skill-load detector's self-test
        run: bash hooks/skill-loads.sh --self-test

      # The well-known index declares a sha256 per skill and the skills CLI
      # verifies it, returning no skill rather than an error when it does not
      # match. So a stale index does not break loudly, it makes
      # `npx skills add getcargo.ai` install nothing at all. Verified both ways
      # against the real CLI: correct digest installs, corrupted digest fails
      # with zero files written.
      - name: Check the well-known index matches its skills
        run: node .github/scripts/build-well-known.mjs --check

  routing-evals:
    name: Route prompts to the right skill
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"

      # The `description` field is the only text an agent sees before deciding
      # whether to load a skill. This is the regression test for it.
      - name: Run routing evals
        run: node .github/scripts/routing-eval.ts
